name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --locked

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          $staging = "compono-$version-win64"
          New-Item -ItemType Directory -Path $staging | Out-Null
          Copy-Item target/release/compono.exe $staging/
          Copy-Item README.md $staging/
          Copy-Item LICENSE $staging/
          Compress-Archive -Path $staging/* -DestinationPath "$staging.zip"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: compono-*-win64.zip
          generate_release_notes: true
